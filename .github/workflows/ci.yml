name: ci

on:
  push:
    branches:
      - develop
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ecs:
    name: ecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jalendport/spark-github-actions/composer-install-dev@master
        with:
          php: "8.2"
      - uses: jalendport/spark-github-actions/composer-run@master
        with:
          php: "8.2"
          script: check-cs

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jalendport/spark-github-actions/composer-install-dev@master
        with:
          php: "8.2"
      - uses: jalendport/spark-github-actions/composer-run@master
        with:
          php: "8.2"
          script: phpstan
